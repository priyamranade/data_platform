x-airflow-common:
  &airflow-common              # ← ADD THIS ANCHOR BACK
  image: apache/airflow:2.11.0
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor  
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__METRICS__STATSD_ON: 'true'
    AIRFLOW__METRICS__STATSD_HOST: 'statsd-exporter'
    AIRFLOW__METRICS__STATSD_PORT: '8125'
    AIRFLOW__METRICS__STATSD_PREFIX: 'airflow'
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags/
    AIRFLOW__LOGGING__REMOTE_LOGGING: 'false'
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 0
    AIRFLOW__LOGGING__PARSED_LOG_SERVER_PORT: 0
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
  volumes:
    - airflow-dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs  
    - ./plugins:/opt/airflow/plugins
    - ./pyspark-jars:/opt/spark/jars:ro
  user: "${AIRFLOW_UID}:0"
  depends_on:
    postgres:
      condition: service_healthy


services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  redis:
    image: redis:6.2
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    entrypoint: /entrypoint
    command: version

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    # healthcheck:
    #   test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]  
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=15d"
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: always

  statsd-exporter:
    image: prom/statsd-exporter:latest
    command:
      - --statsd.mapping-config=/tmp/statsd-mapping.yaml
      - --statsd.listen-udp=0.0.0.0:8125
      - --web.listen-address=0.0.0.0:9102
    ports:
      - "9102:9102"
      - "9125:9125/udp"
    volumes:
      - ./statsd-mapping.yaml:/tmp/statsd-mapping.yaml:ro
    restart: always

  fluentbit:
    image: fluent/fluent-bit:latest
    volumes:
      - airflow-logs:/var/log/airflow:delegated
      - ./fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro  # ✅ ADDED
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    

  git-sync:
    image: alpine/git:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]  # ✅ OVERRIDE git entrypoint
    command: >
      "
      while true; do
        echo '=== Syncing ==='
        rm -rf /git/* &&
        git clone --depth=1 https://github.com/priyamranade/data_platform.git /git/repo &&
        cp -r /git/repo/dags/* /git/ 2>/dev/null || true &&
        cp -r /git/repo/pyspark/* /git/ 2>/dev/null || true &&
        rm -rf /git/repo &&
        chmod +x /git/pyspark/*.py 2>/dev/null || true &&
        date > /git/.synced &&
        echo '✅ Synced at $(date)' &&
        sleep 30
      done
      "
    volumes:
      - airflow-dags:/git:rw
    restart: always

  django-ui:
    build:
      context: ./django-app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./django-app:/app
    environment:
      - DJANGO_SETTINGS_MODULE=data_platform.settings
    depends_on:
      - airflow-webserver
    restart: always


volumes:
  postgres-db-volume:
  prometheus_data:
  grafana_data:
  airflow-dags:
  airflow-logs: