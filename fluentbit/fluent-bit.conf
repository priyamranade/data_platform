[SERVICE]
    Flush         1
    Log_Level     debug

[INPUT]
    Name              tail
    Path              /var/log/airflow/*.log,/var/log/airflow/*/*.log,/var/log/airflow/*/*/*.log,/var/log/airflow/*/*/*/*.log
    Tag               airflow.logs
    Path_Key          filename
    Read_from_Head    True
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Ignore_Older      0

[OUTPUT]
    Name              loki
    Match             *
    Host              loki
    Port              3100
    Labels            job=airflow
    Line_Format       json
    Auto_Kubernetes_Labels Off
