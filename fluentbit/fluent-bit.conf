[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/airflow/**/*.log
    Tag               airflow.logs
    Read_from_Head    true
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[OUTPUT]
    Name            loki
    Match           *
    Host            loki
    Port            3100
    Labels          job=airflow
    Line_Format     json
